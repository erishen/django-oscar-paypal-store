# Compose project name is pinned so renaming the directory does NOT change
# the volume/network prefix. The running containers, the postgres_data volume
# (django-oscar-research_postgres_data) and all hot-patched code stay intact.
name: django-oscar-research

services:
  db:
    image: postgres:15-alpine
    container_name: oscar_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-oscar_db}
      POSTGRES_USER: ${DATABASE_USER:-oscar_user}
      # Read from .env (never hardcode secrets in this committed file)
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oscar_user -d oscar_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oscar_network

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oscar_web
    ports:
      # Container always listens on 8080 internally; WEB_PORT controls the host
      # port published (default 8080). Set WEB_PORT=8092 in .env if 8080 is taken.
      - "${WEB_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      # Comma-separated hosts Django accepts. Override via ALLOWED_HOSTS in .env
      # when serving behind a reverse proxy / custom domain (e.g. shop.example.com).
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,web}"
    volumes:
      - media_volume:/app/sandbox/public/media
      - ./init-db.sh:/app/init-db.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - oscar_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  media_volume:
    driver: local

networks:
  oscar_network:
    driver: bridge
